version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: docassistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: documentation_assistant
    ports:
      - "5434:5432"   # host 5434 → container 5432 (avoids clash with local PG14/18)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentation_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
