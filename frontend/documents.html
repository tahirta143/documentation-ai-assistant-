<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents — Documentation Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon" aria-hidden="true">📚</div>
      <div class="sidebar-logo-text">Docs Assistant<span>AI-powered Q&amp;A</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/static/index.html" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="/static/documents.html" class="nav-link active" aria-current="page"><span class="nav-icon">📁</span> Documents</a>
      <a href="/static/chat.html" class="nav-link"><span class="nav-icon">💬</span> Chat</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <header class="page-header">
      <div>
        <h1 class="page-title">Documents</h1>
        <p class="page-subtitle">Upload and manage your knowledge base</p>
      </div>
    </header>

    <div class="page-body">

      <!-- Upload zone -->
      <div class="card" style="margin-bottom: var(--space-6);">
        <h2 class="card-title" style="margin-bottom:var(--space-4);">Upload a Document</h2>

        <div class="upload-zone" id="uploadZone" role="button" tabindex="0"
             aria-label="Click or drag a file to upload">
          <input type="file" id="fileInput" accept=".pdf,.md,.txt"
                 aria-label="Select file to upload">
          <div class="upload-icon" aria-hidden="true">📤</div>
          <div class="upload-title">Drop your file here, or click to browse</div>
          <div class="upload-hint">Supported formats: PDF, Markdown (.md), Text (.txt) · Max 25 MB</div>
        </div>

        <!-- Upload progress -->
        <div id="uploadProgress" style="display:none; margin-top:var(--space-4);">
          <div style="display:flex; justify-content:space-between; margin-bottom:var(--space-2);">
            <span class="form-label" id="uploadFileName">Uploading…</span>
            <span id="uploadStatus" style="font-size:var(--text-sm); color:var(--color-text-muted);"></span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
      </div>

      <!-- Documents table -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Your Documents <span id="docCount" style="color:var(--color-text-muted);font-weight:400;font-size:var(--text-sm);"></span></h2>
          <button class="btn btn-ghost btn-sm" id="refreshBtn" aria-label="Refresh document list">↺ Refresh</button>
        </div>
        <div id="docsTableContent">
          <div style="padding:var(--space-8);text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
  import { documents } from '/static/js/api.js';
  import { escapeHtml, formatDate, formatBytes, fileTypeIcon, statusBadge, toast } from '/static/js/utils.js';

  // ---- Upload zone wiring ----------------------------------------
  const zone    = document.getElementById('uploadZone');
  const input   = document.getElementById('fileInput');
  const progress = document.getElementById('uploadProgress');
  const fill    = document.getElementById('progressFill');
  const fname   = document.getElementById('uploadFileName');
  const fstatus = document.getElementById('uploadStatus');

  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') input.click(); });

  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });

  input.addEventListener('change', () => { if (input.files[0]) uploadFile(input.files[0]); });

  async function uploadFile(file) {
    fname.textContent  = file.name;
    fstatus.textContent = 'Uploading…';
    progress.style.display = 'block';

    // Animate indeterminate progress
    let p = 0;
    const interval = setInterval(() => {
      p = Math.min(p + Math.random() * 15, 85);
      fill.style.width = p + '%';
    }, 200);

    try {
      await documents.upload(file);
      clearInterval(interval);
      fill.style.width = '100%';
      fstatus.textContent = 'Done!';
      toast(`"${file.name}" uploaded and ingested`, 'success');
      setTimeout(() => { progress.style.display = 'none'; fill.style.width = '0%'; input.value = ''; }, 1500);
      loadDocs();
    } catch (err) {
      clearInterval(interval);
      fill.style.width = '0%';
      progress.style.display = 'none';
      toast(err.message, 'error');
    }
  }

  // ---- Documents table ----------------------------------------
  async function loadDocs() {
    try {
      const data = await documents.list(0, 200);
      const docs = data.items || [];
      document.getElementById('docCount').textContent = `(${data.total})`;
      const container = document.getElementById('docsTableContent');

      if (docs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📂</div>
            <div class="empty-state-title">No documents yet</div>
            <p class="empty-state-text">Upload a PDF, Markdown, or text file above.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Document</th><th>Type</th><th>Size</th><th>Status</th><th>Uploaded</th><th></th>
            </tr></thead>
            <tbody id="docsTableBody"></tbody>
          </table>
        </div>`;

      const tbody = document.getElementById('docsTableBody');
      docs.forEach(doc => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div style="display:flex;align-items:center;gap:var(--space-2);">
              <span aria-hidden="true">${fileTypeIcon(doc.file_type)}</span>
              <span style="font-weight:500;">${escapeHtml(doc.filename)}</span>
            </div>
          </td>
          <td><span style="text-transform:uppercase;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);">${escapeHtml(doc.file_type)}</span></td>
          <td style="color:var(--color-text-muted);">${formatBytes(doc.file_size)}</td>
          <td>${statusBadge(doc.status)}</td>
          <td style="color:var(--color-text-muted);">${formatDate(doc.created_at)}</td>
          <td>
            <button class="btn btn-danger btn-sm" data-id="${doc.id}" data-name="${escapeHtml(doc.filename)}"
                    aria-label="Delete ${escapeHtml(doc.filename)}">
              Delete
            </button>
          </td>`;
        tbody.appendChild(tr);
      });

      // Delete handlers
      tbody.addEventListener('click', async e => {
        const btn = e.target.closest('[data-id]');
        if (!btn) return;
        const id = btn.dataset.id;
        const name = btn.dataset.name;
        if (!confirm(`Delete "${name}"? This also removes all its chunks.`)) return;
        btn.disabled = true;
        try {
          await documents.delete(id);
          toast(`"${name}" deleted`, 'success');
          loadDocs();
        } catch (err) {
          toast(err.message, 'error');
          btn.disabled = false;
        }
      });

    } catch (err) {
      document.getElementById('docsTableContent').innerHTML =
        `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Error loading documents</div><p class="empty-state-text">${escapeHtml(err.message)}</p></div>`;
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', loadDocs);
  loadDocs();
</script>
</body>
</html>
