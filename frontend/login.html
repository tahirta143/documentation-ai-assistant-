<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — Documentation Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg, #0f172a);
      padding: 1.5rem;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--color-text, #f8fafc);
    }
    .login-card {
      background: var(--color-surface, #1e293b);
      border: 1px solid var(--color-border, #334155);
      border-radius: var(--radius-xl, 16px);
      padding: var(--space-8, 2rem);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .login-logo-icon {
      width: 44px;
      height: 44px;
      background: #4f46e5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .login-logo-text { font-weight: 700; font-size: 1.15rem; }
    .login-logo-text span { display: block; font-size: 0.85rem; color: #94a3b8; font-weight: 400; }
    
    .tab-container {
      display: flex;
      border-bottom: 2px solid #334155;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.75rem 0.5rem;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: #ffffff;
    }
    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #4f46e5;
    }
    
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.4rem; color: #cbd5e1; }
    .form-input {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .btn-full {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: #ffffff;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-full:hover {
      background: #4338ca;
    }
    .btn-full:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .notice-box {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .notice-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }
    .notice-success { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid #22c55e; }
    
    .switch-link {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 1.25rem;
    }
    .switch-link a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .switch-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">📚</div>
      <div class="login-logo-text">
        Documentation Assistant
        <span>Enterprise RAG Assistant</span>
      </div>
    </div>

    <!-- Switcher Tabs with Direct Inline Onclick -->
    <div class="tab-container">
      <button class="tab-btn active" id="tabLogin" type="button" onclick="showTab('login')">Sign In</button>
      <button class="tab-btn" id="tabRegister" type="button" onclick="showTab('register')">Create Account</button>
    </div>

    <div id="noticeMsg" class="notice-box" role="alert"></div>

    <!-- Sign In Section -->
    <div id="loginSection" style="display: block;">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email address</label>
          <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-full" id="loginSubmitBtn">Sign In</button>
      </form>
      <div class="switch-link">
        Don't have an account? <a onclick="showTab('register')">Create one here</a>
      </div>
      <p style="text-align:center; font-size:0.75rem; color:#64748b; margin-top:1rem;">
        Default dev account: <code>dev@example.com</code> / <code>password123</code>
      </p>
    </div>

    <!-- Register Section -->
    <div id="registerSection" style="display: none;">
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="regEmail">Email address</label>
          <input class="form-input" type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password (minimum 6 characters)</label>
          <input class="form-input" type="password" id="regPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-full" id="regSubmitBtn">Create Account</button>
      </form>
      <div class="switch-link">
        Already have an account? <a onclick="showTab('login')">Sign in here</a>
      </div>
      <p style="text-align:center; font-size:0.75rem; color:#64748b; margin-top:1rem;">
        Creates a private workspace isolated for your uploaded documentation.
      </p>
    </div>
  </div>

  <script>
    // Tab switching function accessible globally in window
    window.showTab = function(tab) {
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginSection = document.getElementById('loginSection');
      const registerSection = document.getElementById('registerSection');
      const notice = document.getElementById('noticeMsg');

      notice.style.display = 'none';
      notice.textContent = '';

      if (tab === 'register') {
        tabRegister.className = 'tab-btn active';
        tabLogin.className = 'tab-btn';
        registerSection.style.display = 'block';
        loginSection.style.display = 'none';
      } else {
        tabLogin.className = 'tab-btn active';
        tabRegister.className = 'tab-btn';
        loginSection.style.display = 'block';
        registerSection.style.display = 'none';
      }
    };

    function showNotice(msg, isError) {
      const notice = document.getElementById('noticeMsg');
      notice.textContent = msg;
      notice.className = 'notice-box ' + (isError ? 'notice-error' : 'notice-success');
      notice.style.display = 'block';
    }

    // Handle Login
    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Incorrect email or password');
        }

        localStorage.setItem('docs_assistant_token', data.access_token);
        localStorage.setItem('docs_assistant_user', JSON.stringify(data.user));
        window.location.href = '/static/index.html';
      } catch (err) {
        showNotice(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    };

    // Handle Register
    window.handleRegister = async function(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmitBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Creating account…';

        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await res.json();
        if (!res.ok) {
          let detail = data.detail;
          if (Array.isArray(detail)) {
            detail = detail.map(d => d.msg || JSON.stringify(d)).join(', ');
          }
          throw new Error(detail || 'Registration failed');
        }

        localStorage.setItem('docs_assistant_token', data.access_token);
        localStorage.setItem('docs_assistant_user', JSON.stringify(data.user));
        showNotice('Account created successfully! Redirecting…', false);
        setTimeout(function() {
          window.location.href = '/static/index.html';
        }, 500);
      } catch (err) {
        showNotice(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    };
  </script>
</body>
</html>
